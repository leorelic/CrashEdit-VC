name: Build CrashEdit
on:
  push:
    branches: [cpp-port-foundation]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libgl1-mesa-dev libxinerama-dev libxcursor-dev libxi-dev libxrandr-dev libxext-dev libxrender-dev libxfixes-dev libwayland-dev libxkbcommon-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/CrashEdit.exe package/
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath CrashEdit-Windows.zip
      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CrashEdit-Windows
          path: CrashEdit-Windows.zip
      - name: Upload other platform executable
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CrashEdit-${{ runner.os }}
          path: build/CrashEdit
